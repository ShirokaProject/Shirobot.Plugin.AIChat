name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

env:
  PROJECT_DIR: .
  PUBLISH_DIR: bin/Release/net10.0/publish

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish "$PROJECT_DIR" --configuration Release

      - name: Check packaged plugin version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          version="$(dotnet msbuild ShiroBot.AiChatPlugin.csproj -nologo -getProperty:Version -p:Configuration=Release)"
          dotnet run --project scripts/version-check/VersionCheck.csproj -c Release -- \
            "$PUBLISH_DIR/ShiroBot.AiChatPlugin.dll" "$version" "${RELEASE_TAG#v}"

      - name: Package plugin ZIP
        shell: bash
        run: |
          PROJECT="$(basename "$(ls *.csproj | head -1)" .csproj)"
          PLUGIN_DLL="$PUBLISH_DIR/${PROJECT}.dll"
          if [ ! -f "$PLUGIN_DLL" ]; then
            echo "Plugin DLL not found: $PLUGIN_DLL"
            ls -la "$PUBLISH_DIR"
            exit 1
          fi

          unexpected_dlls=()
          for dll in "$PUBLISH_DIR"/*.dll; do
            [ -e "$dll" ] || continue
            if [ "$dll" != "$PLUGIN_DLL" ]; then
              unexpected_dlls+=("$dll")
            fi
          done
          if [ "${#unexpected_dlls[@]}" -ne 0 ]; then
            echo "Publish output contains unexpected DLLs:"
            printf '%s\n' "${unexpected_dlls[@]}"
            exit 1
          fi

          mkdir -p release
          cp "$PLUGIN_DLL" release/
          cd release
          zip -9 ShiroBot.AiChatPlugin.zip ShiroBot.AiChatPlugin.dll
          unzip -l ShiroBot.AiChatPlugin.zip

      - name: Upload plugin ZIP to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release/ShiroBot.AiChatPlugin.zip
