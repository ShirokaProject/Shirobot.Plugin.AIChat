name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

env:
  PROJECT_DIR: .
  PUBLISH_DIR: bin/Release/net11.0/publish

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Verify .NET 11 Runtime Async behavior
        shell: bash
        run: |
          dotnet build Tests/Verification/Verification.csproj -c Release -p:ShiroBotPluginPackagingEnabled=false -p:ShiroBotDevelopmentHostEnabled=false
          dotnet Tests/Verification/bin/Release/net11.0/ShiroBot.AiChatPlugin.Verification.dll
          for suite in provider-models conversation-tools proactive-judge upstream-completion reply-modes group-context skills-concurrency reference-image image-retry image-command downloads http-methods image-api; do
            dotnet Tests/Verification/bin/Release/net11.0/ShiroBot.AiChatPlugin.Verification.dll "--${suite}-offline"
          done

      - name: Publish
        run: dotnet publish "$PROJECT_DIR" --configuration Release

      - name: Verify exported contracts and isolated consumer
        run: dotnet run --project Tests/ContractConsumer -c Release -- "$PUBLISH_DIR/ShiroBot.AiChatPlugin.dll"

      - name: Check packaged plugin version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          version="$(dotnet msbuild ShiroBot.AiChatPlugin.csproj -nologo -getProperty:Version -p:Configuration=Release)"
          dotnet run --project scripts/version-check/VersionCheck.csproj -c Release -- \
            "$PUBLISH_DIR/ShiroBot.AiChatPlugin.dll" "$version" "${RELEASE_TAG#v}"

      - name: Collect Plugin DLL
        shell: bash
        run: |
          PROJECT="$(basename "$(ls *.csproj | head -1)" .csproj)"
          PLUGIN_DLL="$PUBLISH_DIR/${PROJECT}.dll"
          if [ ! -f "$PLUGIN_DLL" ]; then
            echo "Plugin DLL not found: $PLUGIN_DLL"
            ls -la "$PUBLISH_DIR"
            exit 1
          fi

          unexpected_dlls=()
          for dll in "$PUBLISH_DIR"/*.dll; do
            [ -e "$dll" ] || continue
            [ "$dll" = "$PLUGIN_DLL" ] || unexpected_dlls+=("$dll")
          done
          if [ "${#unexpected_dlls[@]}" -ne 0 ]; then
            echo "Publish output contains DLLs other than the single-file plugin:"
            printf '%s\n' "${unexpected_dlls[@]}"
            exit 1
          fi

          mkdir -p release
          cp "$PLUGIN_DLL" release/

      - name: Upload DLL to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: release/*.dll
